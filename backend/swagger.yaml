      parameters:
        - name: conversation
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of recent messages
          schema:
            type: integer
            default: 5
        - name: include_tickets
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: Conversation context
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    format: uuid
                  room:
                    type: object
                    properties:
                      room_number:
                        type: string
                      floor:
                        type: integer
                      room_type:
                        type: string
                  recent_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                        content:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  open_tickets:
                    type: array
                    items:
                      type: object
                  open_tickets_count:
                    type: integer

  /integrations/conversations/{conversation}/chat-id:
    get:
      tags:
        - Integrations
      summary: Get chat ID
      description: Get chat ID for a conversation (for proactive notifications)
      parameters:
        - name: conversation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_id:
                    type: string
                  channel_type:
                    type: string
        '404':
          description: Chat ID not found

  /integrations/conversations/{conversation}/messages:
    post:
      tags:
        - Integrations
      summary: Log message
      description: Log a message to conversation (for n8n)
      parameters:
        - name: conversation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - content
              properties:
                role:
                  type: string
                  enum: [guest, agent, staff, system]
                content:
                  type: string
                extracted_entities:
                  type: object
      responses:
        '201':
          description: Message logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time

  /integrations/tickets:
    post:
      tags:
        - Integrations
      summary: Create ticket
      description: Create a ticket from n8n with auto-assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversation_id
                - category
                - priority
                - description
              properties:
                conversation_id:
                  type: string
                  format: uuid
                room_id:
                  type: string
                  format: uuid
                category:
                  type: string
                  enum: [housekeeping, food_and_drinks, maintenance, room_service, other]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                description:
                  type: string
                source:
                  type: string
                is_emergency:
                  type: boolean
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  department_id:
                    type: string
                    format: uuid
                  assigned_staff_id:
                    type: string
                    format: uuid
                  auto_assigned:
                    type: boolean
                  notification_sent:
                    type: boolean
        '422':
          description: Room information required or department not found

  /integrations/conversations/{conversation}/handoff:
    post:
      tags:
        - Integrations
      summary: Handoff conversation
      description: Mark conversation for human handoff (for n8n)
      parameters:
        - name: conversation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
      responses:
        '200':
          description: Handoff requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  handoff_requested:
                    type: boolean

  /integrations/qr/resolve:
    post:
      tags:
        - Integrations
      summary: Resolve QR token
      description: Resolve QR token from /start command (for n8n)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                    format: uuid
                  room_number:
                    type: string
                  floor:
                    type: integer
                  room_type:
                    type: string
                  token_id:
                    type: string
                    format: uuid
                  success:
                    type: boolean
        '404':
          description: Invalid or expired token

