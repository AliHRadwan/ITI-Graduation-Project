    post:
      tags:
        - Webhooks
      summary: Ticket updated webhook
      description: Webhook endpoint for n8n ticket status updates
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
