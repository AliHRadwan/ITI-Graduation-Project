openapi: 3.0.3
info:
  title: Hotel Service API
  description: |
    API for the Hotel Service Management System - ITI Graduation Project.
    
    This API provides endpoints for:
    - Staff authentication and management
    - Guest and conversation management
    - Ticket management with SLA tracking
    - Room and department management
    - QR code token generation for room access
    - Proactive messaging rules
    - Knowledge base document management
    - Integration endpoints for n8n/external automation
  version: 1.0.0
  contact:
    name: ITI Graduation Project Team

servers:
  - url: http://localhost:8000/api
    description: Local Development Server
  - url: https://concierge.ddns.net/api
    description: Production Server

tags:
  - name: Documentation
    description: API documentation endpoints
  - name: Authentication
    description: Staff authentication endpoints
  - name: Staff Users
    description: Staff user management (Admin/Manager)
  - name: Staff Roles
    description: Staff role management (Admin only)
  - name: Staff Memberships
    description: Staff department memberships (Manager/Admin)
  - name: Guests
    description: Guest identity management
  - name: Conversations
    description: Guest conversation management
  - name: Messages
    description: Conversation messages
  - name: Attachments
    description: File attachments for messages
  - name: Rooms
    description: Hotel room management
  - name: Departments
    description: Department management
  - name: Channels
    description: Channel configuration (Telegram, WhatsApp, etc.)
  - name: Proactive Rules
    description: Proactive messaging rules
  - name: QR Tokens
    description: QR code room tokens
  - name: Tickets
    description: Service ticket management
  - name: SLA
    description: SLA policy management
  - name: Notifications
    description: Notification logs
  - name: Routing Rules
    description: Ticket routing rules
  - name: Dashboard
    description: Dashboard metrics and reports
  - name: Search
    description: Global search
  - name: Knowledge Base
    description: Knowledge document management for RAG
  - name: Integrations
    description: External integration endpoints (n8n)
  - name: Webhooks
    description: Webhook endpoints for external callbacks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sanctum

  schemas:
    # Common Schemas
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
        details:
          type: object

    # User & Auth Schemas
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/StaffRole'
        department:
          $ref: '#/components/schemas/DepartmentSimple'

    StaffRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          enum: [admin, manager, agent]

    StaffMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        staff_user_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        staff_role_id:
          type: integer
        staffUser:
          $ref: '#/components/schemas/StaffUser'
        department:
          $ref: '#/components/schemas/Department'
        role:
          $ref: '#/components/schemas/StaffRole'

    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            memberships:
              type: array
              items:
                type: object
                properties:
                  department:
                    type: string
                  role:
                    type: string
        token:
          type: string

    # Guest & Conversation Schemas
    GuestIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_type:
          type: string
          enum: [telegram, whatsapp, web]
        channel_user_id:
          type: string
        preferred_language:
          type: string
        first_seen_at:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guest_identity_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed, handoff]
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        metadata:
          type: object
        guestIdentity:
          $ref: '#/components/schemas/GuestIdentity'
        room:
          $ref: '#/components/schemas/Room'

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [guest, agent, staff, system]
        content:
          type: string
        extracted_entities:
          type: object
        created_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [image, audio, video, file]
        storage_url:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        transcript:
          type: string

    # Room & Department Schemas
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_number:
          type: string
        status:
          type: string
          enum: [available, occupied, maintenance]
        floor:
          type: integer
        room_type:
          type: string

    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepartmentSimple:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # Channel Config Schema
    ChannelConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_type:
          type: string
          enum: [telegram, whatsapp, web]
        config:
          type: object
        is_active:
          type: boolean

    # Proactive Rule Schema
    ProactiveRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trigger_type:
          type: string
        trigger_config:
          type: object
        message_template:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # QR Token Schema
    QrRoomToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    # Ticket Schemas
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        actor_staff_user_id:
          type: string
          format: uuid
        category:
          type: string
          enum: [housekeeping, food_and_drinks, maintenance, room_service, other]
        status:
          type: string
          enum: [new, doing, done, canceled]
        priority:
          type: string
          enum: [low, med, high, urgent]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        room:
          $ref: '#/components/schemas/Room'
        department:
          $ref: '#/components/schemas/DepartmentSimple'
        staffUser:
          $ref: '#/components/schemas/StaffUser'

    TicketEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        actor_staff_user_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [created, assigned, status_changed, note, escalated, priority_changed]
        note:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        staffUser:
          $ref: '#/components/schemas/StaffUser'

    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    # SLA Schema
    SlaPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        first_response_minutes:
          type: integer
        resolution_minutes:
          type: integer
        quiet_hours:
          type: array
          items:
            type: object
        is_active:
          type: boolean
        department:
          $ref: '#/components/schemas/Department'

    # Notification Log Schema
    NotificationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        channel_type:
          type: string
          enum: [web, telegram, whatsapp]
        message_type:
          type: string
          enum: [confirm, eta, delay, status, rating]
        payload:
          type: string
        sent_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [sent, failed, pending]

    # Routing Rule Schema
    RoutingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        match_category:
          type: string
        priority_default:
          type: string
          enum: [low, med, high, urgent]
        is_active:
          type: boolean
        department:
          $ref: '#/components/schemas/Department'

    # Knowledge Document Schema
    KnowledgeDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        title:
          type: string
        file_name:
          type: string
        file_path:
          type: string
        category:
          type: string
          enum: [policies, rooms_amenities, local_guide, services]
        doc_collection:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        status:
          type: string
          enum: [pending, processing, completed, failed]
        chunks_count:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
        error_message:
          type: string
        uploader:
          $ref: '#/components/schemas/StaffUser'

    # Dashboard Schemas
    DashboardMetrics:
      type: object
      properties:
        openTickets:
          type: integer
        overdue:
          type: integer
        avgRating:
          type: number
        activeConversations:
          type: integer

    SlaReport:
      type: object
      properties:
        totalTickets:
          type: integer
        breaches:
          type: integer
        firstResponseBreaches:
          type: integer
        resolutionBreaches:
          type: integer
        avgResponseMinutes:
          type: number
        avgResolutionMinutes:
          type: number
        coverage:
          type: object
          properties:
            response:
              type: number
            resolution:
              type: number
        availability:
          type: object
          properties:
            avgResponse:
              type: boolean
            avgResolution:
              type: boolean
        quality:
          type: object
          properties:
            response:
              type: string
            resolution:
              type: string
        notes:
          type: array
          items:
            type: string

paths:
  # ==========================================
  # DOCUMENTATION
  # ==========================================
  /docs:
    get:
      tags:
        - Documentation
      summary: Get API documentation
      description: |
        Serves the OpenAPI/Swagger YAML specification file.
        
        **Note:** This endpoint is only available in the local development environment.
      responses:
        '200':
          description: Swagger YAML file
          content:
            text/yaml:
              schema:
                type: string
                description: OpenAPI 3.0 specification in YAML format
        '404':
          description: Swagger file not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: File not found

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login staff user
      description: Authenticate staff user and receive access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout staff user
      description: Revoke all tokens for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get the currently authenticated staff user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      memberships:
                        type: array
                        items:
                          type: object

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset link to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent (if email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password using token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/invite:
    post:
      tags:
        - Authentication
      summary: Invite staff user
      description: Send invitation to new staff member (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Invitation created
        '403':
          description: Forbidden - Admin only

  /auth/invite/accept:
    post:
      tags:
        - Authentication
      summary: Accept invitation
      description: Accept staff invitation and set password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
        '400':
          description: Invalid or expired invitation

  # ==========================================
  # STAFF USERS
  # ==========================================
  /staff/users:
    get:
      tags:
        - Staff Users
      summary: List staff users
      description: Get paginated list of staff users (Manager/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search by name or email
          schema:
            type: string
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: with_trashed
          in: query
          description: Include soft deleted users
          schema:
            type: boolean
        - name: only_trashed
          in: query
          description: Only soft deleted users
          schema:
            type: boolean
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: List of staff users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffUser'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Staff Users
      summary: Create staff user
      description: Create a new staff user (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Staff user created
        '403':
          description: Forbidden - Admin only

  /staff/users/{id}:
    get:
      tags:
        - Staff Users
      summary: Get staff user
      description: Get staff user by ID (Manager/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Staff user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '404':
          description: User not found

    patch:
      tags:
        - Staff Users
      summary: Update staff user
      description: Update staff user (Manager/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                staff_role_id:
                  type: integer
                department_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Staff user updated
        '404':
          description: User not found

    delete:
      tags:
        - Staff Users
      summary: Soft delete staff user
      description: Soft delete a staff user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
        '403':
          description: Forbidden - Admin only

  /staff/users/{id}/deactivate:
    post:
      tags:
        - Staff Users
      summary: Deactivate staff user
      description: Deactivate a staff user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated

  /staff/users/{id}/activate:
    post:
      tags:
        - Staff Users
      summary: Activate staff user
      description: Activate a staff user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User activated

  /staff/users/{id}/restore:
    post:
      tags:
        - Staff Users
      summary: Restore soft deleted user
      description: Restore a soft deleted staff user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User restored

  /staff/users/{id}/force:
    delete:
      tags:
        - Staff Users
      summary: Permanently delete user
      description: Permanently delete a soft deleted staff user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User permanently deleted

  # ==========================================
  # STAFF ROLES
  # ==========================================
  /staff/roles:
    get:
      tags:
        - Staff Roles
      summary: List staff roles
      description: Get all staff roles (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffRole'

    post:
      tags:
        - Staff Roles
      summary: Create staff role
      description: Create a new staff role (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Role created

  /staff/roles/{id}:
    patch:
      tags:
        - Staff Roles
      summary: Update staff role
      description: Update a staff role (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Role updated

    delete:
      tags:
        - Staff Roles
      summary: Delete staff role
      description: Delete a staff role (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Role deleted
        '422':
          description: Role is in use

  # ==========================================
  # STAFF MEMBERSHIPS
  # ==========================================
  /staff/memberships:
    get:
      tags:
        - Staff Memberships
      summary: List staff memberships
      description: Get all staff memberships (Manager/Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
